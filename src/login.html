<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Lumière Airlines</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="index.html" class="brand"
        ><img src="imagen/Exp33.png" alt="Lumière Airlines" class="logo-img" />
        Lumière <span class="gold">Airlines</span></a
      >
      <nav class="mainnav" id="nav-auth-area"></nav>
    </header>

    <div class="split">
      <div
        class="split-media"
        style="
          background-image: url(&quot;https://images.unsplash.com/photo-1747647184634-4f8ea78251fb?auto=format&fit=crop&w=1200&q=80&quot;);
        "
      >
        <div class="quote">
          “Tu próximo destino está a un clic de distancia.”
        </div>
      </div>
      <div class="split-form">
        <div class="inner">
          <h1 class="page-title">Inicio de Sesión</h1>
          <p class="section-sub">
            Ingresa tus datos para ver y reservar vuelos.
          </p>
          <form id="loginForm">
            <div class="field">
              <label for="username">Nombre de usuario</label>
              <input type="text" id="username" name="username" required />
            </div>
            <div class="field">
              <label for="password">Contraseña</label>
              <input type="password" id="password" name="password" required />
            </div>
            <button type="submit" class="btn gold block">Iniciar Sesión</button>
          </form>
          <p id="loginMsg" class="msg hidden"></p>
          <p style="margin-top: 20px">
            ¿No tienes cuenta?
            <a
              href="register.html"
              style="color: var(--blue-accent); font-weight: 600"
              >Regístrate aquí</a
            >.
          </p>
        </div>
      </div>
    </div>

    <script src="js/scripts.js"></script>
  </body>
</html>
