services:
  db:
    image: mysql:8.0
    container_name: flight_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: flight_reservation
      MYSQL_USER: flight_user
      MYSQL_PASSWORD: flight_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: flight_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: flight_user
      DB_PASS: flight_pass
      DB_NAME: flight_reservation
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html

volumes:
  db_data:
